<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="robots" content="noindex" />
  <title>Phone card reader</title>
  <style>
    :root {
      --bg: #f4f6f8; --surface: #ffffff; --ink: #14222c; --muted: #5a6b77; --line: #d5dde3;
      --accent: #0b6b8a; --accent-ink: #ffffff;
      --ready: #14804a; --ready-bg: #e3f4ea; --warn: #8a5a00; --warn-bg: #fff3d6; --bad: #a3231f; --bad-bg: #fde8e7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f171d; --surface: #18232b; --ink: #e8eef2; --muted: #9bacb7; --line: #2b3a45;
        --accent: #4bb3d3; --accent-ink: #06222c;
        --ready: #5fd391; --ready-bg: #123524; --warn: #f0c36a; --warn-bg: #3a2d0d; --bad: #ff8f8a; --bad-bg: #3d1816;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 30rem; margin: 0 auto; padding: 20px 16px 40px; display: grid; gap: 16px; }
    h1 { font-size: 1.35rem; margin: 4px 0 0; }
    .sub { color: var(--muted); margin: 0; font-size: 0.9rem; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
    label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
    input { width: 100%; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
    input:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    button { font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 14px 18px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
    button[disabled] { opacity: 0.55; cursor: default; }
    button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    #start { width: 100%; font-size: 1.15rem; padding: 20px; }
    #status { border-radius: 12px; padding: 14px 16px; font-weight: 600; background: var(--bg); border: 1px solid var(--line); }
    #status.ready { background: var(--ready-bg); color: var(--ready); border-color: var(--ready); }
    #status.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
    #status.bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
    #status small { display: block; font-weight: 400; margin-top: 4px; color: inherit; opacity: 0.9; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    li { display: flex; justify-content: space-between; gap: 12px; font-size: 0.9rem; padding: 8px 0; border-bottom: 1px solid var(--line); }
    li:last-child { border-bottom: 0; }
    li code { font-family: ui-monospace, "SF Mono", Menlo, monospace; overflow-wrap: anywhere; }
    li span { color: var(--muted); white-space: nowrap; }
    .empty { color: var(--muted); font-size: 0.9rem; margin: 0; }
    details summary { cursor: pointer; font-weight: 600; }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    .row input { flex: 1; }
    h2 { font-size: 1rem; margin: 0 0 8px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Phone card reader</h1>
      <p class="sub">Demo only. Hold an ID card on the back of this phone and the Health Centre screen looks it up.</p>
    </header>

    <section class="card">
      <label for="key">Demo key</label>
      <input id="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" />
    </section>

    <button id="start" type="button">Start reader</button>
    <div id="status" role="status" aria-live="polite">Not started.</div>

    <section class="card" aria-labelledby="recent-h">
      <h2 id="recent-h">Recent taps</h2>
      <ul id="recent"></ul>
      <p id="recent-empty" class="empty">Nothing yet.</p>
    </section>

    <section class="card">
      <details>
        <summary>Send a card ID by hand</summary>
        <p class="sub">For testing without a card. Same path as a real tap.</p>
        <div class="row">
          <input id="manual" aria-label="Card ID" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="04:A1:2B:3C" />
          <button id="send" type="button" class="secondary">Send</button>
        </div>
      </details>
    </section>
  </main>
  <script src="tap.js"></script>
</body>
</html>
