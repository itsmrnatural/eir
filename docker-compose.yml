# Health Centre RFID Record System - full stack.
#   docker compose up -d postgres mongo
#   docker compose run --rm db-tools node seed/seed.js --reset
#   docker compose up -d --build server client
# Client: http://localhost:8080   Server: http://localhost:4000/api/v1
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hc_password}
      POSTGRES_DB: ${POSTGRES_DB:-health_centre}
      TZ: Asia/Kolkata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hc} -d ${POSTGRES_DB:-health_centre}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: health_centre
    volumes:
      - mongodata:/data/db
      - ./db/mongo/init.js:/docker-entrypoint-initdb.d/01-init.js:ro
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-off tooling: seed, import, create-user, relink-rfid, explain, integration tests.
  #   docker compose run --rm db-tools npm run test:integration
  db-tools:
    build: ./db
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hc}:${POSTGRES_PASSWORD:-hc_password}@postgres:5432/${POSTGRES_DB:-health_centre}
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: health_centre
    volumes:
      - ./db/seed:/app/seed
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-hc}:${POSTGRES_PASSWORD:-hc_password}@postgres:5432/${POSTGRES_DB:-health_centre}
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: health_centre
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-dev-only-change-me}
      PORT: "4000"
      CORS_ORIGIN: http://localhost:8080,http://localhost:5173
      DUPLICATE_VISIT_WINDOW_MIN: "10"
      REPOS: real
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "4000:4000"

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: http://localhost:4000/api/v1
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  pgdata:
  mongodata:
